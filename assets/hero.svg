<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="khawzk — Cloud &amp; AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f5f0ff"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#ddd6fe" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ede9fe" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b21b6"/><stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/><stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/><stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ddd6fe"/><stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7c3aed" flood-opacity="0.18"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#a78bfa" fill-opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="18" fill="url(#dots)"/>
  <rect width="1200" height="420" rx="18" fill="url(#halo)"/>
  <rect x="1" y="1" width="1198" height="418" rx="18" fill="none" stroke="#e4dcff" stroke-width="2"/>

  <!-- cloud architecture motif, left -->
  <g transform="translate(60 80)">
    <path d="M60 90 a38 38 0 0 1 8 -75 a52 52 0 0 1 98 12 a34 34 0 0 1 4 63 z" fill="#ffffff" stroke="#8b5cf6" stroke-width="2.5" filter="url(#soft)"/>
    <text x="105" y="68" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#7c3aed">cloud</text>
    <g stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="4 5">
      <line x1="105" y1="90" x2="105" y2="135"/>
      <line x1="35" y1="135" x2="175" y2="135"/>
      <line x1="35" y1="135" x2="35" y2="160"/><line x1="105" y1="135" x2="105" y2="160"/><line x1="175" y1="135" x2="175" y2="160"/>
    </g>
    <g fill="#ffffff" stroke="#8b5cf6" stroke-width="2">
      <rect x="10" y="160" width="50" height="62" rx="7"/>
      <rect x="80" y="160" width="50" height="62" rx="7"/>
      <rect x="150" y="160" width="50" height="62" rx="7"/>
    </g>
    <g stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round">
      <line x1="20" y1="178" x2="50" y2="178"/><line x1="20" y1="192" x2="50" y2="192"/><line x1="20" y1="206" x2="40" y2="206"/>
      <line x1="90" y1="178" x2="120" y2="178"/><line x1="90" y1="192" x2="120" y2="192"/><line x1="90" y1="206" x2="110" y2="206"/>
      <line x1="160" y1="178" x2="190" y2="178"/><line x1="160" y1="192" x2="190" y2="192"/><line x1="160" y1="206" x2="180" y2="206"/>
    </g>
  </g>

  <!-- terminal motif, right -->
  <g transform="translate(930 110)" filter="url(#soft)">
    <rect x="0" y="0" width="210" height="150" rx="12" fill="#ffffff" stroke="#e4dcff" stroke-width="2"/>
    <circle cx="18" cy="16" r="5" fill="#ddd6fe"/><circle cx="36" cy="16" r="5" fill="#c4b5fd"/><circle cx="54" cy="16" r="5" fill="#a78bfa"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
      <text x="16" y="56" fill="#8b5cf6">$ <tspan fill="#3b2a63">terraform plan</tspan></text>
      <text x="16" y="82" fill="#8b5cf6">$ <tspan fill="#3b2a63">terraform apply</tspan></text>
      <text x="16" y="108" fill="#7c3aed">✓ <tspan fill="#8b85a0">0 drift · infra up</tspan></text>
      <text x="16" y="134" fill="#8b5cf6">▍</text>
    </g>
  </g>

  <!-- ring -->
  <circle cx="600" cy="175" r="118" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.6"/>
  <circle cx="600" cy="175" r="132" fill="none" stroke="#c4b5fd" stroke-width="1.2" stroke-dasharray="4 10"/>

  <!-- name -->
  <text x="600" y="200" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="6" fill="url(#name)" filter="url(#soft)">KHAWZK</text>
  <rect x="300" y="238" width="600" height="2" fill="url(#line)"/>
  <text x="600" y="282" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#6d28d9" letter-spacing="8">CLOUD &amp; AI ENGINEER</text>
  <text x="600" y="322" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8b85a0">&gt; cloud first. AI only where it actually helps_</text>

  <rect x="480" y="392" width="240" height="4" rx="2" fill="url(#bar)"/>
</svg>
